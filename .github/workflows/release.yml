name: Build preview installers
on:
  workflow_dispatch:
    inputs:
      windows_artifact_run:
        description: "Publish Windows only from a completed Windows build in this branch (Actions run ID). Leave blank to rebuild all platforms."
        type: string
        required: false

permissions:
  contents: read

jobs:
  bundle:
    if: ${{ !inputs.windows_artifact_run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf rpm
      - run: npm ci
      - run: npm test
      - name: Build native preview and CLI
        shell: bash
        run: |
          set -euxo pipefail
          if [[ '${{ matrix.platform }}' == 'macos' ]]; then
            (cd crates/wiggle-desktop && npx tauri build --target universal-apple-darwin --bundles dmg,app)
            cargo build --release -p wiggle-cli --target aarch64-apple-darwin
            cargo build --release -p wiggle-cli --target x86_64-apple-darwin
            mkdir -p releases/macos
            lipo -create target/aarch64-apple-darwin/release/wiggle target/x86_64-apple-darwin/release/wiggle -output releases/macos/wiggle-macos-universal
          elif [[ '${{ matrix.platform }}' == 'windows' ]]; then
            (cd crates/wiggle-desktop && npx tauri build --bundles nsis,msi)
            cargo build --release -p wiggle-cli
            mkdir -p releases/windows
            cp target/release/wiggle.exe releases/windows/wiggle-windows-x64.exe
          else
            (cd crates/wiggle-desktop && npx tauri build --bundles deb,rpm,appimage)
            cargo build --release -p wiggle-cli
            mkdir -p releases/linux
            cp target/release/wiggle releases/linux/wiggle-linux-x64
          fi
          bash scripts/collect-installers.sh '${{ matrix.platform }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wiggle-preview-${{ matrix.platform }}
          path: releases/${{ matrix.platform }}/
          if-no-files-found: error

  publish:
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          pattern: wiggle-preview-*
      - name: Publish unsigned preview installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: preview-${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p upload
          shopt -s nullglob
          windows_setup=(downloads/wiggle-preview-windows/*_x64-setup.exe)
          [[ ${#windows_setup[@]} -eq 1 ]]
          cp "${windows_setup[0]}" upload/Tervixa-Wiggle-Windows-x64-Setup.exe
          for f in downloads/wiggle-preview-*/*; do
            [[ -f "$f" && "$f" != "${windows_setup[0]}" && "$f" != */SHA256SUMS.txt ]] || continue
            platform=$(basename "$(dirname "$f")")
            cp "$f" "upload/${platform#wiggle-preview-}-$(basename "$f")"
          done
          (cd upload && sha256sum * > SHA256SUMS.txt)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Tervixa Wiggle 0.1.1 desktop preview (unsigned, $TAG)" \
            --notes "Unsigned desktop preview installers and standalone CLI. The desktop app includes the workbench and catalogs but not the local gateway: run the gateway separately in a browser for live chat and MCP testing. Check downloads against SHA256SUMS.txt." \
            upload/*

  publish-windows-existing:
    if: ${{ inputs.windows_artifact_run != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.windows_artifact_run }}
    steps:
      - name: Verify the source run and Windows build
        id: source
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          run="repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN"
          metadata=$(gh api "$run")
          jq -e --arg branch "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" \
            '.head_branch == $branch and .head_repository.full_name == $repo and .path == ".github/workflows/release.yml" and .event == "workflow_dispatch"' \
            <<< "$metadata"
          gh api "$run/jobs" --jq '.jobs[] | select(.name == "bundle (windows-latest, windows)") | .conclusion' | grep -Fx success
          echo "sha=$(jq -er .head_sha <<< "$metadata")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: wiggle-preview-windows
          path: windows
          run-id: ${{ inputs.windows_artifact_run }}
          github-token: ${{ github.token }}
      - name: Publish Windows installer and checksum
        env:
          BUILD_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Windows publish failed on line $LINENO: $BASH_COMMAND"' ERR
          mapfile -t setup < <(find windows -type f -iname '*-setup.exe')
          if [[ ${#setup[@]} -ne 1 ]]; then
            echo "::error::Expected one setup EXE. Found: $(find windows -type f -printf '%P ' )"
            exit 1
          fi
          manifest="$(dirname "${setup[0]}")/SHA256SUMS.txt"
          expected=$(awk -v name="$(basename "${setup[0]}")" 'substr($0,67)==name {print $1}' "$manifest")
          actual=$(sha256sum "${setup[0]}" | cut -d ' ' -f 1)
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::Setup EXE did not match the checksum manifest"
            exit 1
          fi
          mkdir -p upload
          cp "${setup[0]}" upload/Tervixa-Wiggle-Windows-x64-Setup.exe
          (cd upload && sha256sum Tervixa-Wiggle-Windows-x64-Setup.exe > SHA256SUMS.txt)
          tag="preview-${SOURCE_RUN}-windows"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish \
            | jq -e --arg sha "$BUILD_SHA" '.isDraft and .targetCommitish == $sha'; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" upload/* 2>release-error.txt || { echo "::error::$(head -1 release-error.txt)"; exit 1; }
          else
            echo "::error::Create a draft release for $tag targeting $BUILD_SHA before dispatching this job."
            exit 1
          fi
