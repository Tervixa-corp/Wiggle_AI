name: CI
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  ui-and-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p wiggle-core -p wiggle-memory -p wiggle-browser -p wiggle-cli
      - run: cargo check -p wiggle-desktop --no-default-features || true
