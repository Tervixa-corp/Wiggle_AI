[package]
name = "wiggle-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wiggle"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
dirs = "5.0"
ratatui = "0.29"
serde_json = "1.0"
tokio = { version = "1.42", features = ["full"] }
wiggle-browser = { path = "../wiggle-browser" }
wiggle-core = { path = "../wiggle-core" }
wiggle-memory = { path = "../wiggle-memory" }
