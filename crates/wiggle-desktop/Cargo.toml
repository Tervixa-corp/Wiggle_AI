[package]
name = "wiggle-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tokio = { version = "1.42", features = ["full"] }
walkdir = "2.5"
wiggle-browser = { path = "../wiggle-browser" }
wiggle-core = { path = "../wiggle-core" }
wiggle-memory = { path = "../wiggle-memory" }
